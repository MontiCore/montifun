pluginManagement {
  // get the plugin using include
  includeBuild('../../..')

  repositories {
    if (("true").equals(getProperty('useLocalRepo'))) {
      mavenLocal()
    }
    maven { url 'https://nexus.se.rwth-aachen.de/content/groups/public' }
    mavenCentral()
    gradlePluginPortal()
  }
}

rootProject.name = 'montifun-gradle-plugin-it'
